name: Release Snippet Palette
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/checks.yml
    with:
      release-tag: ${{ github.ref_name }}
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snippet-palette-${{ github.sha }}
          path: artifacts
      - name: Publish validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Snippet Palette ${RELEASE_TAG#v}" \
            --generate-notes \
            artifacts/snippet-palette/main.js \
            artifacts/snippet-palette/manifest.json \
            artifacts/snippet-palette/styles.css
